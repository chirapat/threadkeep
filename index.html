<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ThreadKeep</title>
  <meta name="description" content="Save Reddit threads with their comments and read them offline.">
  <meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121316" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ThreadKeep">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button id="backBtn" class="icon-btn" aria-label="Back" hidden>
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <h1 id="title">ThreadKeep</h1>
    <button id="settingsBtn" class="icon-btn" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="7" r="2.2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="8" cy="17" r="2.2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
    </button>
  </header>

  <main id="view"></main>

  <div id="progress" class="progress" hidden>
    <span id="progressText">Saving…</span>
    <div class="progress-bar"><div id="progressFill"></div></div>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
  <!-- Privacy-friendly visit counter (no cookies, no personal data). Skips localhost. -->
  <script data-goatcounter="https://buildthingswithcharlie.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
